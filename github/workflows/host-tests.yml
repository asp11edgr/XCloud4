
name: Host regression tests

on:
  push:
    branches:
      - xcloud4-xbox-experience
  pull_request:
    branches:
      - xcloud4-xbox-experience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Portable host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang gcc python3

      - name: Catalog browser tests
        run: bash scripts/test_catalog_browser.sh

      - name: Catalog presentation tests
        run: bash scripts/test_catalog_presentation.sh

      - name: Stream request profile tests
        run: bash scripts/test_stream_request_profile.sh

      - name: Stream OS profile tests
        run: bash scripts/test_stream_os_profile.sh
